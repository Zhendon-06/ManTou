<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ManTou 原生工具体验</title>
  <style>
    :root { color-scheme: light; font-family: "Instrument Sans", system-ui, sans-serif; background: #f6f5ef; color: #232d22; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100%, 720px); margin: auto; padding: 36px 20px 48px; }
    h1 { font-size: clamp(27px, 7vw, 44px); line-height: 1.16; margin: 0 0 24px; letter-spacing: -.04em; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    section { min-width: 0; background: #fff; border: 1px solid #dedfd3; border-radius: 18px; padding: 16px; }
    .tools { display: grid; gap: 12px; }
    @media (min-width: 580px) { .tools { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .actions, .items { display: flex; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; min-height: 42px; padding: 8px 13px; border: 0; border-radius: 10px; background: #2f562d; color: white; }
    button.secondary { background: #ebeee3; color: #314430; }
    button:disabled { opacity: .45; }
    input { width: 100%; padding: 11px; margin-bottom: 10px; font: inherit; border-radius: 10px; border: 1px solid #c7cebf; }
    audio { width: 100%; margin-top: 8px; }
    img { width: 96px; height: 96px; object-fit: cover; display: block; border-radius: 10px; margin-bottom: 6px; }
    output { display: block; font-size: 13px; color: #4e624c; margin-top: 10px; }
    output:empty, .items:empty { display: none; }
    .items { margin-top: 12px; }
    #outside { padding: 12px; background: #ede5d4; border-radius: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>ManTou 原生工具体验</h1>
    <p id="outside" hidden>请用更新后的 ManTou 打开这个 HTML 文件。</p>
    <div class="tools">
      <section>
        <h2>选取系统照片</h2>
        <button id="pick">从相册选照片</button>
        <output id="photoPicker-status" aria-live="polite"></output>
        <div class="items" id="photos"></div>
      </section>
      <section>
        <h2>语音播报</h2>
        <input id="speech-text" aria-label="播报内容" maxlength="500" value="你好，这里是馒头。">
        <div class="actions"><button id="speak">播报</button><button id="stop-speech" class="secondary">停止</button></div>
        <output id="speech-status" aria-live="polite"></output>
      </section>
      <section>
        <h2>系统通知</h2>
        <div class="actions"><button id="notify">发送测试通知</button><button id="cancel-notify" class="secondary">撤销</button></div>
        <output id="notification-status" aria-live="polite"></output>
      </section>
      <section>
        <h2>录音和回放</h2>
        <button id="record">开始录音</button>
        <audio id="playback" controls preload="metadata" hidden></audio>
        <div class="items"><button id="delete-recording" class="secondary" hidden>删除录音</button></div>
        <output id="recorder-status" aria-live="polite"></output>
      </section>
    </div>
  </main>
  <script>
    const element = id => document.getElementById(id);
    const app = window.MantouApp;
    function status(tool, message) { element(`${tool}-status`).textContent = message; }
    function parse(value) { return JSON.parse(value); }

    if (!app || !window.MantouApp_photoPicker) {
      element('outside').hidden = false;
      document.querySelectorAll('button').forEach(button => button.disabled = true);
    } else {
      for (const name of parse(app.getToolNames())) app[name] = window[`MantouApp_${name}`];
      const stored = parse(app.storage.storageRead());
      const saved = stored.success ? JSON.parse(stored.data.content) : {};
      let photos = saved.photos || [];
      let recording = saved.recording || null;
      const pending = new Map();

      function save() { app.storage.storageWrite(JSON.stringify({ photos, recording })); }

      function request(tool, call, onDone) {
        const result = parse(call());
        if (!result.success) return status(tool, result.error);
        pending.set(result.data.requestId, onDone);
        status(tool, '等待结果…');
      }

      for (const tool of ['photoPicker', 'speech', 'notification', 'recorder']) {
        window.addEventListener(`mantou:${tool}`, ({ detail }) => {
          const onDone = pending.get(detail.requestId);
          if (!onDone) return;
          pending.delete(detail.requestId);
          if (detail.success) onDone(detail.data);
          else status(tool, detail.error);
        });
      }

      function renderPhotos() {
        const grid = element('photos');
        grid.replaceChildren();
        photos.forEach((photo, index) => {
          const item = document.createElement('div');
          const image = document.createElement('img');
          image.alt = `选择的照片 ${index + 1}`;
          image.src = photo.url;
          const remove = document.createElement('button');
          remove.textContent = '删除';
          remove.className = 'secondary';
          remove.onclick = () => {
            const result = parse(app.photoPicker.photoDelete(photo.id));
            if (!result.success) return status('photoPicker', result.error);
            photos = photos.filter(item => item.id !== photo.id);
            save();
            renderPhotos();
          };
          item.append(image, remove);
          grid.append(item);
        });
      }

      function renderRecording() {
        const player = element('playback');
        player.hidden = !recording;
        element('delete-recording').hidden = !recording;
        if (recording) player.src = recording.url;
        else { player.removeAttribute('src'); player.load(); }
      }

      element('pick').onclick = () => request('photoPicker', () => app.photoPicker.photoPick(5), data => {
        if (data.cancelled) return status('photoPicker', '已取消');
        photos.push(...data.photos);
        save();
        renderPhotos();
        status('photoPicker', `已保存 ${data.photos.length} 张照片`);
      });
      element('speak').onclick = () => request('speech', () => app.speech.speechSpeak(element('speech-text').value, 'zh-CN'), () => status('speech', '播报完成'));
      element('stop-speech').onclick = () => request('speech', () => app.speech.speechStop(), data => status('speech', data.stopped ? '已停止' : '没有正在进行的播报'));
      element('notify').onclick = () => request('notification', () => app.notification.notificationShow('tool-demo', 'ManTou 测试通知', '从通知栏点这条消息可返回体验页。'), () => status('notification', '已发送，请查看通知栏'));
      element('cancel-notify').onclick = () => request('notification', () => app.notification.notificationCancel('tool-demo'), () => status('notification', '已撤销'));
      element('record').onclick = () => request('recorder', () => app.recorder.recordAudio(), data => {
        if (data.cancelled) return status('recorder', '已取消');
        if (recording) app.recorder.recordingDelete(recording.id);
        recording = data;
        save();
        renderRecording();
        status('recorder', `已保存 ${Math.round(data.durationMs / 1000)} 秒录音`);
      });
      element('delete-recording').onclick = () => {
        const result = parse(app.recorder.recordingDelete(recording.id));
        if (!result.success) return status('recorder', result.error);
        recording = null;
        save();
        renderRecording();
        status('recorder', '已删除');
      };
      renderPhotos();
      renderRecording();
    }
  </script>
</body>
</html>
